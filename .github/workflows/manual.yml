name: Manual Workflow

on:
  workflow_dispatch:
    inputs:
      environment: 
        description: "Choose Environment"
        required: true
        default: "Staging"
        type: choice
        options:
          - Staging
          - Production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Application
        run: echo "Deploying the Application to ${{ inputs.environment }}.
